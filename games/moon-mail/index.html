<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moon Mail</title><style>body{margin:0;display:grid;min-height:100vh;place-items:center;background:#b9d8ea;color:#271e29;font-family:system-ui,sans-serif}.game{max-width:620px;padding:40px;text-align:center}.sky{height:260px;position:relative;border:2px solid #271e29;background:#94bed6;overflow:hidden}.star{position:absolute;background:#fff;border-radius:50%;width:10px;height:10px;cursor:pointer}.moon{font-size:75px}.letter{font-size:55px;margin-top:30px}button{padding:12px 18px;background:#271e29;color:white;border:0;margin-top:20px;cursor:pointer}</style></head><body><main class="game"><p>DEMO / REPLACE WITH YOUR OWN GAME</p><h1>Moon Mail</h1><p id="copy">Find three stars to send your letter.</p><div class="sky"><div class="moon">☾</div><div class="letter">✉</div></div><button onclick="location.href='../../'">Back to portfolio</button></main><script>const sky=document.querySelector('.sky'),copy=document.querySelector('#copy');let found=0;for(let i=0;i<3;i++){let s=document.createElement('button');s.className='star';s.style.left=(15+i*30)+'%';s.style.top=(45-i*12)+'%';s.onclick=()=>{s.remove();copy.textContent=++found===3?'Your letter is on its way ✦':`Stars found: ${found}/3`};sky.append(s)}</script></body></html>
