<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Whispering Garden</title><style>body{margin:0;display:grid;min-height:100vh;place-items:center;background:#ffe2eb;color:#271e29;font-family:system-ui,sans-serif}.game{max-width:620px;padding:40px;text-align:center}.garden{height:250px;position:relative;border:2px solid #271e29;background:#f5b8cb;overflow:hidden}.flower{position:absolute;font-size:60px;cursor:pointer;transition:transform .2s}.flower:hover{transform:scale(1.2)}.flower:nth-child(1){left:12%;top:30%}.flower:nth-child(2){left:43%;top:10%}.flower:nth-child(3){right:14%;top:35%}button{padding:12px 18px;background:#271e29;color:white;border:0;margin-top:20px;cursor:pointer}</style></head><body><main class="game"><p>DEMO / REPLACE WITH YOUR OWN GAME</p><h1>Whispering Garden</h1><p id="copy">Click the flowers to hear the garden.</p><div class="garden"><button class="flower" aria-label="flower">✿</button><button class="flower" aria-label="flower">✽</button><button class="flower" aria-label="flower">❀</button></div><button onclick="location.href='../../'">Back to portfolio</button></main><script>let n=0;const lines=['A bee hums a tiny tune.','The leaves are trading secrets.','A seed dreams of being tall.'];document.querySelectorAll('.flower').forEach(x=>x.onclick=()=>{document.querySelector('#copy').textContent=lines[n++%lines.length]})</script></body></html>
