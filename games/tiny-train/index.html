<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tiny Train</title><style>body{margin:0;display:grid;min-height:100vh;place-items:center;background:#f7dc79;color:#271e29;font-family:system-ui,sans-serif}.game{max-width:620px;padding:40px;text-align:center}.track{height:220px;display:grid;place-items:center;border:2px solid #271e29;background:#ffe9a1}.train{font-size:80px;transition:transform 1.3s ease}.go{transform:translateX(300px)}button{padding:12px 18px;background:#271e29;color:white;border:0;margin:20px 5px 0;cursor:pointer}</style></head><body><main class="game"><p>DEMO / REPLACE WITH YOUR OWN GAME</p><h1>Tiny Train</h1><p>Send a tiny train on its journey.</p><div class="track"><div id="train" class="train">🚂</div></div><button id="go">Start train</button><button onclick="location.href='../../'">Back to portfolio</button></main><script>document.querySelector('#go').onclick=()=>{const t=document.querySelector('#train');t.classList.remove('go');void t.offsetWidth;t.classList.add('go')}</script></body></html>
